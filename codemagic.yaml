workflows:
  pocket-unsigned-ipa:
    name: Pocket unsigned IPA
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_SCHEME: Pocket
        XCODE_PROJECT: PocketApp.xcodeproj
      xcode: latest
    scripts:
      - name: Generate Xcode project
        script: |
          set -euo pipefail
          python3 scripts/gen_xcodeproj.py
      - name: Build unsigned iOS app
        script: |
          set -euo pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""
      - name: Package IPA
        script: |
          set -euo pipefail
          chmod +x scripts/package_ipa.sh
          DERIVED_DATA_PATH="$CM_BUILD_DIR/build" \
          IPA_OUTPUT="$CM_BUILD_DIR/Pocket.ipa" \
          scripts/package_ipa.sh
    artifacts:
      - Pocket.ipa
      - build/Build/Products/Release-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
